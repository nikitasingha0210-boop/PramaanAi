version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pramaanai
      POSTGRES_PASSWORD: pramaanai_dev_password
      POSTGRES_DB: pramaanai
    volumes:
      - pramaanai_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaanai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://pramaanai:pramaanai_dev_password@db:5432/pramaanai
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_dev_only_insecure_secret_key}
      ENV: development
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m api.seed.seed &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pramaanai_pgdata:
